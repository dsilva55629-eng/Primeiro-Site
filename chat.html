<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chat - Primeiro Site</title>

    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            color: #222;
        }

        .container {
            width: 100%;
            max-width: 700px;
            height: 100vh;
            margin: auto;
            display: flex;
            flex-direction: column;
            background: white;
        }

        .topo {
            background: #222;
            color: white;
            padding: 18px;
            text-align: center;
        }

        .topo h1 {
            margin: 0;
            font-size: 24px;
        }

        .usuario {
            margin-top: 5px;
            font-size: 14px;
            color: #ccc;
        }

        #mensagens {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .mensagem {
            background: #eeeeee;
            padding: 10px 12px;
            border-radius: 10px;
            max-width: 85%;
            word-wrap: break-word;
        }

        .nome {
            font-weight: bold;
            margin-right: 6px;
        }

        .hora {
            font-size: 11px;
            color: #777;
            margin-left: 6px;
        }

        .formulario {
            display: flex;
            gap: 8px;
            padding: 12px;
            border-top: 1px solid #ddd;
            background: #fafafa;
        }

        #mensagem {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
        }

        #mensagem:focus {
            border-color: #555;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #444;
        }

        .voltar {
            display: block;
            text-align: center;
            padding: 10px;
            color: #555;
            text-decoration: none;
            font-size: 14px;
        }

        .voltar:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="topo">
        <h1>💬 Chat</h1>

        <div class="usuario">
            Você está como: <strong>{{ usuario }}</strong>
        </div>
    </div>

    <div id="mensagens">

        {% for msg in historico %}
        <div class="mensagem">
            <span class="nome">{{ msg.usuario }}:</span>
            <span>{{ msg.mensagem }}</span>
            <span class="hora">{{ msg.hora }}</span>
        </div>
        {% endfor %}

    </div>

    <form class="formulario" id="formulario">
        <input
            type="text"
            id="mensagem"
            placeholder="Digite uma mensagem..."
            autocomplete="off"
            maxlength="500"
        >

        <button type="submit">Enviar</button>
    </form>

    <a href="/" class="voltar">← Voltar</a>

</div>

<script>
    const socket = io();

    const formulario = document.getElementById("formulario");
    const input = document.getElementById("mensagem");
    const mensagens = document.getElementById("mensagens");

    formulario.addEventListener("submit", function(event) {
        event.preventDefault();

        const mensagem = input.value.trim();

        if (mensagem === "") {
            return;
        }

        socket.emit("enviar_mensagem", {
            mensagem: mensagem
        });

        input.value = "";
        input.focus();
    });

    socket.on("receber_mensagem", function(data) {

        const div = document.createElement("div");
        div.className = "mensagem";

        const nome = document.createElement("span");
        nome.className = "nome";
        nome.textContent = data.usuario + ":";

        const texto = document.createElement("span");
        texto.textContent = data.mensagem;

        const hora = document.createElement("span");
        hora.className = "hora";
        hora.textContent = data.hora;

        div.appendChild(nome);
        div.appendChild(texto);
        div.appendChild(hora);

        mensagens.appendChild(div);

        mensagens.scrollTop = mensagens.scrollHeight;
    });

    // Deixa o chat já na última mensagem quando abrir
    mensagens.scrollTop = mensagens.scrollHeight;
</script>

</body>
</html>
