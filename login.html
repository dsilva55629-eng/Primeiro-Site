<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Primeiro Site</title>

    <style>
        :root {
            --fundo: #0f1115;
            --caixa: #181b21;
            --caixa-secundaria: #20242c;
            --texto: #ffffff;
            --texto-secundario: #aeb4c0;
            --borda: #303641;
            --botao: #5865f2;
            --botao-hover: #4752c4;
            --erro: #ff6b6b;
        }

        [data-theme="light"] {
            --fundo: #f2f3f5;
            --caixa: #ffffff;
            --caixa-secundaria: #f0f1f3;
            --texto: #17191c;
            --texto-secundario: #626873;
            --borda: #d5d8de;
            --botao: #5865f2;
            --botao-hover: #4752c4;
            --erro: #d93030;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, sans-serif;

            background: var(--fundo);
            color: var(--texto);

            transition: background 0.2s, color 0.2s;
        }

        .container {
            width: 100%;
            max-width: 430px;
            padding: 20px;
        }

        .caixa {
            background: var(--caixa);
            border: 1px solid var(--borda);
            border-radius: 18px;
            padding: 30px;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        h1 {
            text-align: center;
            margin: 0 0 8px;
            font-size: 28px;
        }

        .subtitulo {
            text-align: center;
            color: var(--texto-secundario);
            margin-bottom: 28px;
        }

        .campo {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;

            border-radius: 10px;
            border: 1px solid var(--borda);

            background: var(--caixa-secundaria);
            color: var(--texto);

            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: var(--botao);
        }

        .lembrar {
            display: flex;
            align-items: center;
            gap: 8px;

            margin: 4px 0 20px;

            color: var(--texto-secundario);
            font-size: 14px;
            font-weight: normal;
        }

        .lembrar input {
            width: auto;
            cursor: pointer;
        }

        button {
            width: 100%;
            padding: 13px;

            border: none;
            border-radius: 10px;

            background: var(--botao);
            color: white;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;

            transition: background 0.2s;
        }

        button:hover {
            background: var(--botao-hover);
        }

        .separador {
            display: flex;
            align-items: center;
            gap: 12px;

            margin: 25px 0;

            color: var(--texto-secundario);
            font-size: 13px;
        }

        .separador::before,
        .separador::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--borda);
        }

        .cadastro {
            text-align: center;
        }

        .cadastro p {
            color: var(--texto-secundario);
            font-size: 14px;
            margin-bottom: 12px;
        }

        .botao-cadastro {
            background: var(--caixa-secundaria);
            border: 1px solid var(--borda);
            color: var(--texto);
        }

        .botao-cadastro:hover {
            background: var(--borda);
        }

        .tema {
            position: fixed;
            top: 18px;
            right: 18px;

            width: auto;
            padding: 9px 13px;

            background: var(--caixa);
            color: var(--texto);

            border: 1px solid var(--borda);
            border-radius: 10px;

            font-size: 13px;
        }

        .tema:hover {
            background: var(--caixa-secundaria);
        }

        .senha-info {
            color: var(--texto-secundario);
            font-size: 12px;
            margin-top: 5px;
        }
    </style>
</head>

<body>

    <button class="tema" id="toggleTema" onclick="alternarTema()">
        ☀️ Modo Claro
    </button>

    <div class="container">

        <div class="caixa">

            <h1>Primeiro Site</h1>

            <div class="subtitulo">
                Entre na sua conta
            </div>


            <!-- LOGIN -->

            <form action="/entrar" method="POST">

                <div class="campo">
                    <label for="usuario">Usuário</label>

                    <input
                        type="text"
                        id="usuario"
                        name="usuario"
                        placeholder="Digite seu usuário"
                        autocomplete="username"
                        required
                    >
                </div>


                <div class="campo">
                    <label for="senha">Senha</label>

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                        autocomplete="current-password"
                        required
                    >
                </div>


                <label class="lembrar">
                    <input
                        type="checkbox"
                        name="lembrar"
                        id="lembrar"
                    >

                    <span>Lembrar de mim</span>
                </label>


                <button type="submit">
                    Entrar
                </button>

            </form>


            <div class="separador">
                ou
            </div>


            <!-- CADASTRO -->

            <div class="cadastro">

                <p>
                    Ainda não tem uma conta?
                </p>

                <form action="/cadastrar" method="POST">

                    <div class="campo">
                        <label for="novo_usuario">Novo usuário</label>

                        <input
                            type="text"
                            id="novo_usuario"
                            name="usuario"
                            placeholder="Escolha um usuário"
                            autocomplete="username"
                            required
                        >
                    </div>


                    <div class="campo">
                        <label for="nova_senha">Nova senha</label>

                        <input
                            type="password"
                            id="nova_senha"
                            name="senha"
                            placeholder="Escolha uma senha"
                            autocomplete="new-password"
                            required
                        >

                        <div class="senha-info">
                            A senha precisa ter pelo menos 4 caracteres.
                        </div>
                    </div>


                    <button
                        type="submit"
                        class="botao-cadastro"
                    >
                        Criar conta
                    </button>

                </form>

            </div>

        </div>

    </div>


    <script>

        function aplicarTema() {

            const tema =
                localStorage.getItem("tema") || "dark";

            const botao =
                document.getElementById("toggleTema");


            if (tema === "light") {

                document.documentElement.setAttribute(
                    "data-theme",
                    "light"
                );

                botao.innerText =
                    "🌙 Modo Escuro";

            } else {

                document.documentElement.removeAttribute(
                    "data-theme"
                );

                botao.innerText =
                    "☀️ Modo Claro";
            }
        }


        function alternarTema() {

            const temaAtual =
                localStorage.getItem("tema") || "dark";


            if (temaAtual === "light") {

                localStorage.setItem(
                    "tema",
                    "dark"
                );

            } else {

                localStorage.setItem(
                    "tema",
                    "light"
                );
            }


            aplicarTema();
        }


        aplicarTema();

    </script>

</body>
</html>
