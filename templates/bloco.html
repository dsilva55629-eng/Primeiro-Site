<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Bloco de Notas do Davi</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #12121f, #1a1a2e);
            color: #f5f5f7;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
            margin: 0;
        }
        .container {
            background-color: #1f1f33;
            padding: 30px;
            border-radius: 16px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        h1 { color: #00ff88; margin-top: 0; }
        textarea {
            width: 100%;
            height: 300px;
            background-color: #151524;
            color: white;
            border: 2px solid #3d3d5c;
            border-radius: 8px;
            padding: 15px;
            font-size: 16px;
            resize: none;
            box-sizing: border-box;
            margin-bottom: 20px;
        }
        .btn-salvar {
            background: #00ff88;
            color: #121214;
            border: none;
            padding: 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            width: 100%;
        }
        .btn-voltar {
            display: inline-block;
            margin-bottom: 20px;
            color: #a0a0c0;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="/" class="btn-voltar">⬅️ Voltar ao Menu Principal</a>
        <h1>📝 Bloco de Notas (Usuário: {{ usuario }})</h1>
        <form action="/salvar_nota" method="POST">
            <textarea name="conteudo_nota" placeholder="Escreva suas anotações aqui personalizadas...">{{ texto_nota }}</textarea>
            <button type="submit" class="btn-salvar">💾 Salvar Nota Permanentemente</button>
        </form>
    </div>

</body>
</html>
