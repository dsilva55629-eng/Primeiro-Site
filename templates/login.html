<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Primeiro Site</title>

    <style>

        :root {
            --fundo: #0f1115;
            --caixa: #181b21;
            --caixa-secundaria: #20242c;
            --texto: #ffffff;
            --texto-secundario: #aeb4c0;
            --borda: #303641;
            --botao: #5865f2;
            --botao-hover: #4752c4;
        }


        [data-theme="light"] {
            --fundo: #f2f3f5;
            --caixa: #ffffff;
            --caixa-secundaria: #f0f1f3;
            --texto: #17191c;
            --texto-secundario: #626873;
            --borda: #d5d8de;
            --botao: #5865f2;
            --botao-hover: #4752c4;
        }


        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            font-family: Arial, sans-serif;

            background: var(--fundo);
            color: var(--texto);

            transition:
                background 0.2s,
                color 0.2s;
        }


        /* =================================================
           CONTAINER
           ================================================= */

        .container {
            width: 100%;
            max-width: 430px;
        }


        .caixa {
            width: 100%;

            background: var(--caixa);

            border: 1px solid var(--borda);
            border-radius: 18px;

            padding: 30px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.25);
        }


        /* =================================================
           TÍTULO
           ================================================= */

        h1 {
            text-align: center;

            margin: 0 0 8px;

            font-size: 28px;
        }


        .subtitulo {
            text-align: center;

            color: var(--texto-secundario);

            margin-bottom: 28px;
        }


        /* =================================================
           CAMPOS
           ================================================= */

        .campo {
            margin-bottom: 18px;
        }


        label {
            display: block;

            margin-bottom: 7px;

            font-size: 14px;
            font-weight: bold;
        }


        input {
            width: 100%;

            padding: 13px;

            border-radius: 10px;

            border: 1px solid var(--borda);

            background: var(--caixa-secundaria);
            color: var(--texto);

            outline: none;

            font-size: 15px;
        }


        input:focus {
            border-color: var(--botao);
        }


        /* =================================================
           LEMBRAR
           ================================================= */

        .lembrar {
            display: flex;

            align-items: center;

            gap: 8px;

            margin: 4px 0 20px;

            color: var(--texto-secundario);

            font-size: 14px;
            font-weight: normal;
        }


        .lembrar input {
            width: auto;

            cursor: pointer;
        }


        /* =================================================
           BOTÕES
           ================================================= */

        button {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 10px;

            background: var(--botao);

            color: white;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;

            transition:
                background 0.2s,
                transform 0.1s;
        }


        button:hover {
            background: var(--botao-hover);
        }


        button:active {
            transform: scale(0.98);
        }


        /* =================================================
           TROCA LOGIN / CADASTRO
           ================================================= */

        .troca-tela {
            text-align: center;

            margin-top: 25px;
        }


        .troca-tela p {
            margin: 0;

            color: var(--texto-secundario);

            font-size: 14px;
        }


        .link {
            display: inline-block;

            margin-top: 8px;

            color: var(--botao);

            font-size: 14px;
            font-weight: bold;

            cursor: pointer;

            text-decoration: none;
        }


        .link:hover {
            text-decoration: underline;
        }


        /* =================================================
           CADASTRO
           ================================================= */

        #telaCadastro {
            display: none;
        }


        .senha-info {
            color: var(--texto-secundario);

            font-size: 12px;

            margin-top: 5px;
        }


        /* =================================================
           BOTÃO DE TEMA
           ================================================= */

        .tema {
            position: fixed;

            top: 18px;
            right: 18px;

            z-index: 1000;

            width: auto;

            padding: 9px 13px;

            background: var(--caixa);

            color: var(--texto);

            border: 1px solid var(--borda);

            border-radius: 10px;

            font-size: 13px;

            white-space: nowrap;
        }


        .tema:hover {
            background: var(--caixa-secundaria);
        }


        /* =================================================
           CELULAR
           ================================================= */

        @media (max-width: 600px) {

            body {
                padding: 15px;
            }


            .container {
                max-width: 100%;
            }


            .caixa {
                padding: 24px 20px;

                border-radius: 15px;
            }


            h1 {
                font-size: 25px;
            }


            .subtitulo {
                margin-bottom: 24px;
            }


            .tema {
                top: 12px;
                right: 12px;

                padding: 8px 10px;

                font-size: 12px;
            }

        }

    </style>
</head>


<body>


    <!-- BOTÃO DE TEMA -->

    <button
        type="button"
        class="tema"
        id="toggleTema"
        onclick="alternarTema()"
    >
        ☀️ Modo Claro
    </button>



    <div class="container">

        <div class="caixa">


            <!-- =================================================
                 TELA DE LOGIN
                 ================================================= -->

            <div id="telaLogin">

                <h1>
                    Primeiro Site
                </h1>


                <div class="subtitulo">
                    Entre na sua conta
                </div>


                <form
                    action="/entrar"
                    method="POST"
                >


                    <div class="campo">

                        <label for="usuario">
                            Usuário
                        </label>


                        <input
                            type="text"
                            id="usuario"
                            name="usuario"
                            placeholder="Digite seu usuário"
                            autocomplete="username"
                            required
                        >

                    </div>



                    <div class="campo">

                        <label for="senha">
                            Senha
                        </label>


                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="Digite sua senha"
                            autocomplete="current-password"
                            required
                        >

                    </div>



                    <label class="lembrar">

                        <input
                            type="checkbox"
                            name="lembrar"
                            id="lembrar"
                        >

                        <span>
                            Lembrar de mim
                        </span>

                    </label>



                    <button type="submit">
                        Entrar
                    </button>


                </form>



                <!-- IR PARA CADASTRO -->

                <div class="troca-tela">

                    <p>
                        Ainda não tem uma conta?
                    </p>


                    <a
                        class="link"
                        onclick="mostrarCadastro()"
                    >
                        Crie aqui
                    </a>

                </div>

            </div>



            <!-- =================================================
                 TELA DE CADASTRO
                 ================================================= -->

            <div id="telaCadastro">

                <h1>
                    Criar conta
                </h1>


                <div class="subtitulo">
                    Crie sua conta no Primeiro Site
                </div>



                <form
                    action="/cadastrar"
                    method="POST"
                >


                    <!-- NOME -->

                    <div class="campo">

                        <label for="nome">
                            Seu nome
                        </label>


                        <input
                            type="text"
                            id="nome"
                            name="nome"
                            placeholder="Digite seu nome"
                            autocomplete="name"
                            maxlength="100"
                            required
                        >

                    </div>



                    <!-- USUÁRIO -->

                    <div class="campo">

                        <label for="novo_usuario">
                            Usuário
                        </label>


                        <input
                            type="text"
                            id="novo_usuario"
                            name="usuario"
                            placeholder="Escolha um usuário"
                            autocomplete="username"
                            maxlength="30"
                            required
                        >

                    </div>



                    <!-- SENHA -->

                    <div class="campo">

                        <label for="nova_senha">
                            Senha
                        </label>


                        <input
                            type="password"
                            id="nova_senha"
                            name="senha"
                            placeholder="Escolha uma senha"
                            autocomplete="new-password"
                            minlength="4"
                            required
                        >


                        <div class="senha-info">
                            A senha precisa ter pelo menos 4 caracteres.
                        </div>

                    </div>



                    <button type="submit">
                        Criar conta
                    </button>


                </form>



                <!-- VOLTAR PARA LOGIN -->

                <div class="troca-tela">

                    <p>
                        Já tem uma conta?
                    </p>


                    <a
                        class="link"
                        onclick="mostrarLogin()"
                    >
                        Entre aqui
                    </a>

                </div>

            </div>


        </div>

    </div>



    <script>


        /* =================================================
           TROCAR PARA CADASTRO
           ================================================= */

        function mostrarCadastro() {

            document.getElementById(
                "telaLogin"
            ).style.display = "none";


            document.getElementById(
                "telaCadastro"
            ).style.display = "block";

        }



        /* =================================================
           VOLTAR PARA LOGIN
           ================================================= */

        function mostrarLogin() {

            document.getElementById(
                "telaCadastro"
            ).style.display = "none";


            document.getElementById(
                "telaLogin"
            ).style.display = "block";

        }



        /* =================================================
           TEMA
           ================================================= */

        function aplicarTema() {

            const tema =
                localStorage.getItem("tema")
                || "dark";


            const botao =
                document.getElementById(
                    "toggleTema"
                );


            if (tema === "light") {

                document.documentElement.setAttribute(
                    "data-theme",
                    "light"
                );


                botao.innerText =
                    "🌙 Modo Escuro";

            }

            else {

                document.documentElement.removeAttribute(
                    "data-theme"
                );


                botao.innerText =
                    "☀️ Modo Claro";

            }

        }



        function alternarTema() {

            const temaAtual =
                localStorage.getItem("tema")
                || "dark";


            if (temaAtual === "light") {

                localStorage.setItem(
                    "tema",
                    "dark"
                );

            }

            else {

                localStorage.setItem(
                    "tema",
                    "light"
                );

            }


            aplicarTema();

        }



        aplicarTema();


    </script>


</body>
</html>
