<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Mural de Recados</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #12121f, #1a1a2e);
            color: #f5f5f7;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
            margin: 0;
        }
        .container {
            background-color: #1f1f33;
            padding: 30px;
            border-radius: 16px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        h1 { color: #00ff88; margin-top: 0; }
        form { display: flex; gap: 10px; margin-bottom: 25px; }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 2px solid #3d3d5c;
            border-radius: 8px;
            background-color: #151524;
            color: white;
        }
        button {
            background: #00ff88;
            color: #121214;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        ul { list-style: none; padding: 0; margin: 0; }
        li {
            background: #282845;
            padding: 14px;
            margin-bottom: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 5px solid #00ff88;
        }
        .autor { font-weight: bold; color: #00ff88; font-size: 13px; }
        .hora-recado { font-size: 11px; color: #a0a0c0; }
        .btn-deletar { color: #ff5555; text-decoration: none; font-weight: bold; }
        .btn-voltar {
            display: inline-block;
            margin-bottom: 20px;
            color: #a0a0c0;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="/" class="btn-voltar">⬅️ Voltar ao Menu Principal</a>
        <h1>💬 Mural de Recados</h1>
        <form action="/adicionar_mural" method="POST">
            <input type="text" name="tarefa" placeholder="Deixe um recado público..." required>
            <button type="submit">Postar</button>
        </form>
        <ul>
            {% for tarefa in tarefas %}
            <li>
                <div style="display: flex; flex-direction: column; gap: 4px;">
                    <span class="autor">By: {{ tarefa.usuario }}</span>
                    <span>{{ tarefa.texto }}</span>
                    <span class="hora-recado">{{ tarefa.hora }}</span>
                </div>
                <a href="/deletar_mural/{{ tarefa.id }}" class="btn-deletar">❌</a>
            </li>
            {% endfor %}
        </ul>
    </div>

</body>
</html>
