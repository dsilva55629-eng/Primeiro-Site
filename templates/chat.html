<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chat - Primeiro Site</title>

    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

    <style>
        :root {
            --bg: linear-gradient(135deg, #12121f, #1a1a2e);
            --container: #1f1f33;
            --input: #151524;
            --border: #3d3d5c;
            --text: #f5f5f7;
            --primary: #00ff88;
            --mensagem: #292940;
            --botao: #00ff88;
            --botao-texto: #121214;
        }

        [data-theme="light"] {
            --bg: linear-gradient(135deg, #e0e5ec, #f0f4f8);
            --container: #ffffff;
            --input: #f5f7fa;
            --border: #d1d9e6;
            --text: #2b2b40;
            --primary: #007bff;
            --mensagem: #e9edf3;
            --botao: #007bff;
            --botao-texto: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .container {
            width: 95%;
            max-width: 700px;
            height: 90vh;
            margin: 5vh auto;
            display: flex;
            flex-direction: column;
            background: var(--container);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .topo {
            background: var(--container);
            color: var(--text);
            padding: 18px;
            text-align: center;
            border-bottom: 1px solid var(--border);
        }

        .topo h1 {
            margin: 0;
            font-size: 24px;
        }

        .usuario {
            margin-top: 5px;
            font-size: 14px;
            opacity: 0.7;
        }

        #mensagens {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .mensagem {
            background: var(--mensagem);
            padding: 10px 12px;
            border-radius: 10px;
            max-width: 85%;
            word-wrap: break-word;
        }

        .nome {
            font-weight: bold;
            color: var(--primary);
            margin-right: 6px;
        }

        .hora {
            font-size: 11px;
            opacity: 0.6;
            margin-left: 6px;
        }

        .formulario {
            display: flex;
            gap: 8px;
            padding: 12px;
            border-top: 1px solid var(--border);
            background: var(--container);
        }

        #mensagem {
            flex: 1;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            outline: none;
            font-size: 15px;
            background: var(--input);
            color: var(--text);
        }

        #mensagem::placeholder {
            color: var(--text);
            opacity: 0.5;
        }

        #mensagem:focus {
            border-color: var(--primary);
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            background: var(--botao);
            color: var(--botao-texto);
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        button:hover {
            opacity: 0.85;
        }

        .voltar {
            display: block;
            text-align: center;
            padding: 12px;
            color: var(--text);
            background: var(--container);
            text-decoration: none;
            font-size: 14px;
            border-top: 1px solid var(--border);
        }

        .voltar:hover {
            background: var(--input);
        }
    </style>
</head>

<body>

<div class="container">

    <div class="topo">
        <h1>💬 Chat</h1>

        <div class="usuario">
            Você está como:
            <strong>{{ usuario }}</strong>
        </div>
    </div>

    <div id="mensagens">

        {% for msg in historico %}
        <div class="mensagem">
            <span class="nome">{{ msg.usuario }}:</span>
            <span>{{ msg.mensagem }}</span>
            <span class="hora">{{ msg.hora }}</span>
        </div>
        {% endfor %}

    </div>

    <form class="formulario" id="formulario">

        <input
            type="text"
            id="mensagem"
            placeholder="Digite uma mensagem..."
            autocomplete="off"
            maxlength="500"
        >

        <button type="submit">
            Enviar
        </button>

    </form>

    <a href="/" class="voltar">
        ← Voltar ao menu
    </a>

</div>

<script>

    // =========================
    // TEMA
    // =========================

    function aplicarTema() {

        const tema = localStorage.getItem("tema") || "dark";

        if (tema === "light") {

            document.documentElement.setAttribute(
                "data-theme",
                "light"
            );

        } else {

            document.documentElement.removeAttribute(
                "data-theme"
            );
        }
    }

    aplicarTema();


    // =========================
    // SOCKET.IO
    // =========================

    const socket = io();

    const formulario =
        document.getElementById("formulario");

    const input =
        document.getElementById("mensagem");

    const mensagens =
        document.getElementById("mensagens");


    // =========================
    // ENVIAR MENSAGEM
    // =========================

    formulario.addEventListener(
        "submit",
        function(event) {

            event.preventDefault();

            const mensagem =
                input.value.trim();

            if (mensagem === "") {
                return;
            }

            socket.emit(
                "enviar_mensagem",
                {
                    mensagem: mensagem
                }
            );

            input.value = "";
            input.focus();
        }
    );


    // =========================
    // RECEBER MENSAGEM
    // =========================

    socket.on(
        "receber_mensagem",
        function(data) {

            const div =
                document.createElement("div");

            div.className = "mensagem";


            const nome =
                document.createElement("span");

            nome.className = "nome";

            nome.textContent =
                data.usuario + ":";


            const texto =
                document.createElement("span");

            texto.textContent =
                data.mensagem;


            const hora =
                document.createElement("span");

            hora.className = "hora";

            hora.textContent =
                data.hora;


            div.appendChild(nome);
            div.appendChild(texto);
            div.appendChild(hora);


            mensagens.appendChild(div);

            mensagens.scrollTop =
                mensagens.scrollHeight;
        }
    );


    // Vai direto para a última mensagem
    mensagens.scrollTop =
        mensagens.scrollHeight;

</script>

</body>
</html>
